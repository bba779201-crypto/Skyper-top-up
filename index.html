<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Other ស្បែកជើងគុណភាពល្អ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- Header -->
    <header class="bg-gradient-to-r from-violet-700 to-purple-800 text-white shadow-md p-4 text-center">
        <h1 class="text-lg font-bold">Free Other ស្បែកជើងគុណភាពល្អ</h1>
        <p class="text-xs text-violet-200">ហាងស្បែកជើងអនឡាញ</p>
    </header>

    <!-- Product Grid -->
    <main class="max-w-4xl mx-auto px-4 mt-6">
        <div id="productGrid" class="grid grid-cols-2 gap-4">
            <!-- ផលិតផលនឹងត្រូវទាញមកបង្ហាញទីនេះដោយស្វ័យប្រវត្តិ -->
        </div>
    </main>

    <script>
        const telegramUsername = "Rara12234";
        const products = [
            { name: "ស្បែកជើង Crocs ម៉ូដពិសេស ០១", price: "15.00", image: "https://i.ibb.co/fV6q5vkY/IMG-1703-c17803.png" },
            { name: "ស្បែកជើង Crocs ម៉ូដពិសេស ០២", price: "15.00", image: "https://i.ibb.co/27Z6ZpGF/IMG-1704-c1ce1b.png" },
            { name: "ស្បែកជើង Crocs ម៉ូដពិសេស ០៣", price: "15.00", image: "https://i.ibb.co/pvyZBNP4/IMG-1705-c1d90a.jpg" },
            { name: "ស្បែកជើង Crocs ស្ដង់ដារ ០៤", price: "10.00", image: "https://i.ibb.co/Hft4Fpz7/IMG-1706-538965.jpg" },
            { name: "ស្បែកជើង Crocs ស្ដង់ដារ ០៥", price: "10.00", image: "https://i.ibb.co/DHWv1XBq/IMG-1707-1b033d.jpg" },
            { name: "ស្បែកជើង Crocs ពេញនិយម ០៦", price: "12.00", image: "https://i.ibb.co/FqHZ48Lk/IMG-1708-8e6d23.jpg" }
        ];

        const grid = document.getElementById('productGrid');
        products.forEach(p => {
            const url = `https://t.me/${telegramUsername}?text=` + encodeURIComponent(`សួស្តី! ខ្ញុំចង់ទិញ ${p.name} តម្លៃ $${p.price}`);
            grid.innerHTML += `
                <div class="bg-white rounded-xl shadow p-3 flex flex-col justify-between">
                    <div>
                        <img src="${p.image}" class="w-full h-36 object-cover rounded-lg mb-2">
                        <h3 class="text-xs font-semibold">${p.name}</h3>
                        <p class="text-violet-600 font-bold text-sm">$${p.price}</p>
                    </div>
                    <a href="${url}" target="_blank" class="mt-3 bg-violet-600 text-white text-center py-2 rounded-lg text-xs font-medium">ឆាតទិញ</a>
                </div>
            `;
        });
    </script>
</body>
</html>
